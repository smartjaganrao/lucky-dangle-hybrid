<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lucky Dangle Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="dg-container">
    <svg id="dg-svg">
      <defs id="dg-defs"></defs>
      <!-- One <g class="dg-dangle"> per hanging charm is added here by overlay.js -->
      <g id="dg-world"></g>
    </svg>
    <!-- Each charm also adds its own grab zone, anchor handle and close button here -->
    <div id="dg-context-menu" class="dg-context-menu">
      <div class="dg-cm-item" id="dg-cm-ritual"><span class="dg-cm-icon">✨</span> Perform Ritual</div>
      <div class="dg-cm-item" id="dg-cm-add"><span class="dg-cm-icon">➕</span> Hang Another</div>
      <div class="dg-cm-item" id="dg-cm-gallery"><span class="dg-cm-icon">🎨</span> Charm Gallery…</div>
      <div class="dg-cm-item" id="dg-cm-remove"><span class="dg-cm-icon">➖</span> Remove This Charm</div>
      <div class="dg-cm-item" id="dg-cm-toggle"><span class="dg-cm-icon">🙈</span> Hide All <kbd>Ctrl+D</kbd></div>
      <div class="dg-cm-separator"></div>
      <div class="dg-cm-item dg-cm-danger" id="dg-cm-quit"><span class="dg-cm-icon">❌</span> Exit App Completely</div>
    </div>
    <div id="dg-toast"></div>
  </div>

  <audio id="dg-sound-ghanta" src="../assets/sounds/ghanta-ring.wav" preload="auto"></audio>

  <script src="charms.js"></script>
  <script src="physics.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
